<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING CLIMB | Player ID Check</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1012;color:#f5f9f7;font:16px/1.6 system-ui,-apple-system,sans-serif;padding:28px 18px}.wrap{max-width:660px;margin:auto}h1{font-size:26px;color:#dfff2e;margin:10px 0}h2{font-size:17px;margin:22px 0 8px}.note{color:#aab7b5}.card{background:#192327;border:1px solid #405256;border-radius:12px;padding:16px;margin:12px 0}.id{font-size:13px;overflow-wrap:anywhere;color:#dfff2e}strong{color:#dfff2e}.ok{color:#dfff2e}.warn{color:#ffbf75}button{border:0;border-radius:9px;background:#dfff2e;color:#111;padding:13px 18px;font-weight:800;width:100%;margin:15px 0}small{color:#94a7a5}hr{border:0;border-top:1px solid #344147}</style></head><body><div class="wrap"><h1>KING CLIMB</h1><p>PLAYER ID CHECK · 読み取り専用</p><p class="note">Ver.108と同じサイトで開くと、このブラウザ内の登録情報を照合できます。記録の削除・更新・送信は行いません。</p><div id="out"></div><button id="refresh">再確認</button><small>表示されるIDはアカウントを区別するための識別子です。公開SNSなどには掲載しないでください。</small></div><script>
(()=>{'use strict';const out=document.getElementById('out');const bestId='882558c4-461b-4181-b31c-37cf32b7deb1';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(k,v)=>`<p><small>${esc(k)}</small><br><span class="id">${esc(v||'(なし)')}</span></p>`;function render(){try{const active=localStorage.getItem('kingClimbActiveV66')||'';let roster;try{roster=JSON.parse(localStorage.getItem('kingClimbRosterV66')||'[]')}catch(e){roster=[]}if(!Array.isArray(roster))roster=[];const selected=roster.find(p=>p&&p.id===active);const legacy=active?localStorage.getItem('kingClimbV66Id_'+active)||'':'';let match=active===bestId||legacy===bestId;let html=`<div class="card"><h2>現在のプレイヤー</h2>${row('名前',selected?.nickname||'(見つかりません)')}${row('ローカルID',active)}${row('オンライン用ID (既存別名)',legacy)}`;if(!selected)html+='<p class="warn">このブラウザでは登録済みプレイヤーを確認できません。Ver.108と同じドメイン、同じSafariで開いているか確認してください。</p>';else if(match)html+='<p class="ok"><strong>一致：</strong>現在のプレイヤーIDは4.743秒のオンライン記録と一致しています。</p>';else html+='<p class="warn"><strong>不一致：</strong>現在のプレイヤーIDと、4.743秒のオンライン記録は異なります。</p>';html+='</div>';html+=`<div class="card"><h2>オンライン記録 4.743秒</h2>${row('保存されているプレイヤーID',bestId)}</div>`;html+='<div class="card"><h2>この端末の登録プレイヤー</h2>';for(const p of roster){if(!p?.id)continue;html+=`<hr>${row('名前',p.nickname)}${row('ID',p.id)}${row('オンライン別名',localStorage.getItem('kingClimbV66Id_'+p.id)||'')}`}if(!roster.length)html+='<p>登録情報がありません。</p>';html+='</div>';out.innerHTML=html}catch(e){out.textContent='読込エラー: '+e.message}}document.getElementById('refresh').addEventListener('click',render);render()})();
</script></body></html>
